<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Inspection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <h1>New Inspection</h1>
    </header>

    <main class="container">

        <!-- CARD GRID FOR QUICK STATS -->
        <section class="card-grid">

            <div class="card card-blue">
                <h2>Today's Inspections</h2>
                <p id="todayCount">0</p>
            </div>

            <div class="card card-red">
                <h2>Open Issues</h2>
                <p id="openCount">0</p>
            </div>

            <div class="card card-green">
                <h2>Resolved Today</h2>
                <p id="resolvedCount">0</p>
            </div>

        </section>

        <!-- INSPECTION FORM -->
        <section class="form-section">
            <h2>Submit New Inspection</h2>

            <form id="inspectionForm" class="inspection-form">

                <label>Inspector</label>
                <select id="inspector" required>
                    <option value="">Select Inspector</option>
                    <option>Ken Westenkirchner</option>
                    <option>Christie Westenkirchner</option>
                    <option>Cole Westenkirchner</option>
                    <option>Zachary Westenkirchner</option>
                </select>

                <label>Location</label>
                <select id="location" required>
                    <option value="">Select Location</option>
                    <option>Church</option>
                    <option>School</option>
                    <option>Gym</option>
                    <option>Hall</option>
                    <option>Kitchen</option>
                </select>

                <label>Status</label>
                <select id="status" required>
                    <option value="">Select Status</option>
                    <option>No Issues Found</option>
                    <option>Open Issue</option>
                    <option>Resolved</option>
                </select>

                <label>Notes</label>
                <textarea id="notes" placeholder="Enter notes here..."></textarea>

                <button type="submit" class="submit-btn">Submit Inspection</button>

            </form>
        </section>

        <!-- RECENT SUBMISSIONS -->
        <section class="table-section">
            <h2>Recent Submissions</h2>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Inspector</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="recentTableBody">
                    <!-- Filled by JS -->
                </tbody>
            </table>
        </section>

    </main>

    <footer class="footer">
        <p>SF Knights Facilities • Inspection System</p>
    </footer>

<script>
const API_GET = "https://script.google.com/macros/s/AKfycbyB4dnmyZ6ryNIX5atAnhf0J1m6HnxDLzadJtdXf0COKaDDY08H0VlL0CZQSOO5KQmi2g/exec?action=getAllInspections";
const API_POST = "https://script.google.com/macros/s/AKfycbyB4dnmyZ6ryNIX5atAnhf0J1m6HnxDLzadJtdXf0COKaDDY08H0VlL0CZQSOO5KQmi2g/exec";

/* LOAD DASHBOARD COUNTS + RECENT TABLE */
async function loadData() {
    try {
        const response = await fetch(API_GET);
        const data = await response.json();

        const today = new Date().toLocaleDateString();

        document.getElementById("todayCount").textContent =
            data.filter(x => (x.timestamp || "").includes(today)).length;

        document.getElementById("openCount").textContent =
            data.filter(x => x.status === "Open Issue").length;

        document.getElementById("resolvedCount").textContent =
            data.filter(x => x.status === "Resolved").length;

        const tbody = document.getElementById("recentTableBody");
        tbody.innerHTML = "";

        data.slice().reverse().forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${item.timestamp || ""}</td>
                <td>${item.inspector || ""}</td>
                <td>${item.location || ""}</td>
                <td>${item.status || ""}</td>
                <td>${item.notes || ""}</td>
            `;
            tbody.appendChild(row);
        });

    } catch (err) {
        console.error("Error loading data:", err);
    }
}

/* SUBMIT FORM */
document.getElementById("inspectionForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
        inspector: document.getElementById("inspector").value,
        location: document.getElementById("location").value,
        status: document.getElementById("status").value,
        notes: document.getElementById("notes").value,
        action: "addInspection"
    };

    try {
        await fetch(API_POST, {
            method: "POST",
            body: JSON.stringify(payload)
        });

        alert("Inspection submitted successfully!");

        document.getElementById("inspectionForm").reset();
        loadData();

    } catch (err) {
        console.error("Error submitting inspection:", err);
        alert("Error submitting inspection.");
    }
});

loadData();
</script>

</body>
</html>
