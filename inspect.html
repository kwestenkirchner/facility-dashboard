<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inspection Form</title>

<style>
    :root {
        --bg: #f4f6f9;
        --text: #001F3F;
        --card: #ffffff;
        --accent: #FFDC00;
        --field-bg: #ffffff;
        --field-border: #ccc;
    }

    [data-theme="dark"] {
        --bg: #00152A;
        --text: #ffffff;
        --card: #0A2A4A;
        --accent: #FFDC00;
        --field-bg: #0A2A4A;
        --field-border: rgba(255,255,255,0.2);
    }

    body {
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        transition: background 0.3s, color 0.3s;
    }

    header {
        background: #001F3F;
        color: white;
        padding: 16px;
        font-size: 22px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .toggle {
        cursor: pointer;
        font-size: 16px;
        background: var(--accent);
        color: #001F3F;
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 600;
    }

    .container {
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    label {
        font-weight: 600;
        margin-top: 20px;
        display: block;
    }

    select {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        border-radius: 8px;
        border: 1px solid var(--field-border);
        background: var(--field-bg);
        color: var(--text);
        font-size: 18px;
    }

    .sticky-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--card);
        padding: 12px;
        display: flex;
        gap: 10px;
        box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
    }

    .btn {
        flex: 1;
        padding: 16px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        color: white;
        cursor: pointer;
    }

    .green { background: #2ECC40; }
    .red { background: #FF4136; }
</style>

<script>
function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);

    const toggle = document.getElementById("themeToggle");
    toggle.textContent = theme === "dark" ? "Light Mode ☀️" : "Dark Mode 🌙";
}

window.onload = () => {
    const saved = localStorage.getItem("theme") || "light";
    applyTheme(saved);
};

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
}

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbyB4dnmyZ6ryNIX5atAnhf0J1m6HnxDLzadJtdXf0COKaDDY08H0VlL0CZQSOO5KQmi2g/exec";

async function submitNoIssues() {
    const inspector = document.getElementById("inspector").value;
    const location = document.getElementById("location").value;

    if (!inspector || !location) {
        alert("Please select both Inspector and Location.");
        return;
    }

    const payload = {
        action: "logNoIssue",
        inspector,
        location
    };

    await fetch(BACKEND_URL, {
        method: "POST",
        body: JSON.stringify(payload)
    });

    alert("No Issues logged successfully.");
    location.reload();
}

function reportIssue() {
    const inspector = document.getElementById("inspector").value;
    const location = document.getElementById("location").value;

    if (!inspector || !location) {
        alert("Please select both Inspector and Location.");
        return;
    }

    const formURL =
      "https://docs.google.com/forms/d/e/1FAIpQLScp8u1x0YqYpYg7wHkRkV4xg5xV2r0tZq7uQ2xk9p3Y2u7QxA/viewform" +
      `?usp=pp_url&entry.1111111111=${encodeURIComponent(inspector)}` +
      `&entry.2222222222=${encodeURIComponent(location)}`;

    window.location.href = formURL;
}
</script>

</head>
<body>

<header>
    Inspection Form
    <div id="themeToggle" class="toggle" onclick="toggleTheme()">Dark Mode 🌙</div>
</header>

<div class="container">
    <label>Inspector</label>
    <select id="inspector">
        <option value="">Select Inspector</option>
        <option>Ken</option>
        <option>Corey</option>
        <option>Christie</option>
        <option>Other</option>
    </select>

    <label>Location</label>
    <select id="location">
        <option value="">Select Location</option>
        <option>Cafeteria</option>
        <option>3rd Floor</option>
        <option>Gym</option>
        <option>Hallway A</option>
        <option>Hallway B</option>
        <option>Restroom 1</option>
        <option>Restroom 2</option>
        <option>Outside Grounds</option>
    </select>
</div>

<div class="sticky-bar">
    <button class="btn green" onclick="submitNoIssues()">No Issues</button>
    <button class="btn red" onclick="reportIssue()">Issue Found</button>
</div>

</body>
</html>
