<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection Interface</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>Inspection Interface</h1>
</header>

<main class="container">

    <!-- Inspector Selection -->
    <section class="form-section">
        <h2>Inspector</h2>

        <select id="inspectorSelect" class="inspector-select">
            <option value="">Select Inspector</option>
            <option value="Ken Westenkirchner">Ken Westenkirchner</option>
            <option value="Corey Driver">Corey Driver</option>
            <option value="Murell Gregory">Murell Gregory</option>
            <option value="Khyle Weirich">Khyle Weirich</option>
            <option value="Paris Martin">Paris Martin</option>
            <option value="Matt Prater">Matt Prater</option>
            <option value="Micheal Hagmeyer">Micheal Hagmeyer</option>
            <option value="other">Other (type name)</option>
        </select>

        <input type="text" id="otherInspector" placeholder="Enter your name"
               style="display:none; margin-top:10px;">
    </section>

    <!-- Areas Table -->
    <section class="table-section">
        <h2>Areas</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Area</th>
                    <th>Last Inspected</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="areasBody"></tbody>
        </table>
    </section>

</main>

<footer class="footer">
    <p>SF Knights Facilities • Inspection Interface</p>
</footer>

<script>
const API_GET = "https://script.google.com/macros/s/AKfycbyB4dnmyZ6ryNIX5atAnhf0J1m6HnxDLzadJtdXf0COKaDDY08H0VlL0CZQSOO5KQmi2g/exec?action=getAllInspections";
const API_POST = "https://script.google.com/macros/s/AKfycbyB4dnmyZ6ryNIX5atAnhf0J1m6HnxDLzadJtdXf0COKaDDY08H0VlL0CZQSOO5KQmi2g/exec";

const FORM_URL = "https://docs.google.com/forms/d/1NqM4VzYqgct8mvS3Z-XDP604Lpy7iwM5sLE094BxWUA/viewform";

const FIELD_INSPECTOR = "entry.1456245431";
const FIELD_LOCATION = "entry.1739126018";

const LOCATIONS = [
    "3rd Floor Restroom",
    "2nd Floor Restroom",
    "Cafeteria Mens Restroom",
    "Auxiliary Gym Locker Room - South Gym Locker Room",
    "Auxiliary Gym Locker Room - North Wrestling-Baseball Locker Room"
];

document.getElementById("inspectorSelect").addEventListener("change", () => {
    const val = document.getElementById("inspectorSelect").value;
    document.getElementById("otherInspector").style.display =
        val === "other" ? "block" : "none";
});

async function loadInterface() {
    const res = await fetch(API_GET);
    const data = await res.json();

    const lastByLocation = {};
    data.forEach(r => {
        if (!lastByLocation[r.location]) lastByLocation[r.location] = r;
        else lastByLocation[r.location] = r;
    });

    const tbody = document.getElementById("areasBody");
    tbody.innerHTML = "";

    LOCATIONS.forEach(loc => {
        const last = lastByLocation[loc];
        const lastTime = last ? (last.timestamp || "") : "No inspections yet";

        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${loc}</td>
            <td>${lastTime}</td>
            <td>
                <button class="btn-all-clear" data-location="${loc}">All Clear</button>
                <button class="btn-issue" data-location="${loc}">Issue Found</button>
            </td>
        `;
        tbody.appendChild(row);
    });

    attachHandlers();
}

function getInspector() {
    const sel = document.getElementById("inspectorSelect").value;
    if (!sel) {
        alert("Please select an inspector.");
        return null;
    }
    if (sel === "other") {
        const name = document.getElementById("otherInspector").value.trim();
        if (!name) {
            alert("Please type your name.");
            return null;
        }
        return name;
    }
    return sel;
}

async function handleAllClear(location) {
    const inspector = getInspector();
    if (!inspector) return;

    const payload = {
        inspector: inspector,
        location: location,
        "Issues Found (Select all that apply)": "No Issues Found",
        Resolved: "TRUE",
        notes: "",
        action: "addInspection"
    };

    await fetch(API_POST, {
        method: "POST",
        body: JSON.stringify(payload)
    });

    alert(`All Clear recorded for ${location}.`);
    loadInterface();
}

function handleIssueFound(location) {
    const inspector = getInspector();
    if (!inspector) return;

    const url =
        `${FORM_URL}?usp=pp_url&${FIELD_INSPECTOR}=${encodeURIComponent(inspector)}&${FIELD_LOCATION}=${encodeURIComponent(location)}`;

    window.location.href = url;
}

function attachHandlers() {
    document.querySelectorAll(".btn-all-clear").forEach(btn => {
        btn.addEventListener("click", () => handleAllClear(btn.dataset.location));
    });

    document.querySelectorAll(".btn-issue").forEach(btn => {
        btn.addEventListener("click", () => handleIssueFound(btn.dataset.location));
    });
}

loadInterface();
</script>

</body>
</html>
