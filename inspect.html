<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facility Inspection</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #000000;
    }

    .dark {
        background: #1e1e1e;
        color: #ffffff;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background: #f2f2f2;
    }

    .dark header {
        background: #2c2c2c;
    }

    .container {
        padding: 20px;
    }

    select, textarea, button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    button {
        cursor: pointer;
        font-weight: bold;
    }

    .good {
        background: #2ecc71;
        color: white;
        border: none;
    }

    .bad {
        background: #e74c3c;
        color: white;
        border: none;
    }
</style>

</head>
<body>

<header>
    <h2>Facility Inspection</h2>
    <button id="themeToggle">🌙</button>
</header>

<div class="container">

    <label>Inspector</label>
    <select id="inspector">
        <option value="">Select Inspector</option>
        <option value="Ken Westenkirchner">Ken Westenkirchner</option>
        <option value="Maintenance Staff">Maintenance Staff</option>
        <option value="Custodial Staff">Custodial Staff</option>
    </select>

    <label>Location</label>
    <select id="location">
        <option value="">Select Location</option>
        <option>3rd Level Restroom</option>
        <option>2nd Level Restroom</option>
        <option>Cafeteria Mens Restroom</option>
        <option>Auxiliary Gym Locker Room – South Gym Locker Room</option>
        <option>Auxiliary Gym Locker Room – North Wrestling Baseball Locker Room</option>
    </select>

    <label>Notes (optional)</label>
    <textarea id="notes" rows="4" placeholder="Add notes..."></textarea>

    <button class="good" onclick="submitNoIssue()">No Issues Found</button>
    <button class="bad" onclick="submitIssue()">Issue Found</button>

</div>

<script>
    // Theme toggle
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    });

    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
    }

    // No Issues Found submission
    async function submitNoIssue() {
        const inspector = document.getElementById('inspector').value;
        const location = document.getElementById('location').value;
        const notes = document.getElementById('notes').value.trim();

        if (!inspector || !location) {
            alert("Please select an inspector and location.");
            return;
        }

        const payload = {
            action: "logNoIssue",
            inspector: inspector,
            location: location,
            description: notes || "No Issues Found",
            type: "No Issues Found",
            photos: false,
            status: "Resolved"
        };

        try {
            const response = await fetch("https://script.google.com/macros/s/AKfycbyB4dnmyZ6ryNIX5atAnhf0J1m6HnxDLzadJtdXf0COKaDDY08H0VlL0CZQSOO5KQmi2g/exec", {
                method: "POST",
                mode: "cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.ok) {
                alert("Inspection logged successfully!");
                document.getElementById('notes').value = "";
            } else {
                alert("There was a problem submitting. Please try again.");
            }
        } catch (err) {
            alert("There was a problem submitting. Please try again.");
        }
    }

    // Issue Found → Google Form
    function submitIssue() {
        const inspector = document.getElementById('inspector').value;
        const location = document.getElementById('location').value;
        const notes = document.getElementById('notes').value.trim();

        if (!inspector || !location) {
            alert("Please select an inspector and location.");
            return;
        }

        const url =
            "YOUR_GOOGLE_FORM_URL" +
            "?entry.111=" + encodeURIComponent(inspector) +
            "&entry.222=" + encodeURIComponent(location) +
            "&entry.333=" + encodeURIComponent(notes);

        window.open(url, "_blank");
    }
</script>

</body>
</html>
