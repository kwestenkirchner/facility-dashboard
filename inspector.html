<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFDS Inspector Panel</title>

  <link rel="stylesheet" href="style.css?v=5001" />
  <link rel="icon" type="image/png" href="sfds-favicon.png" />
</head>

<body data-page="inspector">
<header class="c-header">
  <div class="c-header-bar"></div>
  <div class="c-header-inner">
    <div class="c-header-title">
      <h1>St. Francis de Sales — Inspector Panel</h1>
      <p>Log inspections and issues in real time</p>
    </div>

    <div class="c-header-right">
      <div class="live-pill">
        <div class="live-dot"></div>
        LIVE
      </div>
      <div class="clock" id="clockInspector">--:--</div>
    </div>
  </div>
</header>

<main class="c-main">

  <div class="card">
    <div class="ctitle">Inspector & Location</div>
    <div class="form-row">
      <div class="form-field">
        <label for="inspectorSelect">Inspector</label>
        <select id="inspectorSelect">
          <option value="">Select inspector...</option>
        </select>
      </div>
      <div class="form-field">
        <label for="locationSelect">Location</label>
        <select id="locationSelect">
          <option value="">Select location...</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="ctitle">Inspection Status</div>
    <div class="status-buttons">
      <button class="status-btn ok" data-status="all_clear">All Clear</button>
      <button class="status-btn warn" data-status="issues_found">Issues Found</button>
      <button class="status-btn due" data-status="inspection_due">Inspection Due</button>
    </div>

    <div class="form-field">
      <label for="issueNotes">Notes / Issues</label>
      <textarea id="issueNotes" rows="4" placeholder="Describe any issues, or leave blank if all clear..."></textarea>
    </div>

    <button class="rbtn primary" id="submitInspectionBtn">Submit Inspection</button>
  </div>

  <div class="card">
    <div class="ctitle">Next Inspection</div>
    <div id="nextInspection">No upcoming inspection scheduled.</div>
  </div>

  <div class="foot">SFDS Inspector Panel</div>

</main>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
