<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFDS Inspector Interface</title>

  <link rel="stylesheet" href="style.css?v=5001" />
  <link rel="icon" type="image/png" href="sfds-favicon.png" />
</head>

<body>

<header class="c-header">
  <div class="c-header-bar"></div>
  <div class="c-header-inner">
    <div class="c-header-title">
      <h1>St. Francis de Sales — Inspector Panel</h1>
      <p>Live Facility Inspection</p>
    </div>

    <div class="c-header-right">
      <div class="live-pill">
        <div class="live-dot"></div>
        LIVE
      </div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>
</header>

<main class="c-main">

  <!-- Inspector selection -->
  <div class="card">
    <div class="ctitle">Inspector</div>
    <div class="ing">
      <div class="icard" style="max-width: 320px;">
        <div class="isub">Select your name</div>
        <select id="inspectorSelect" style="width:100%; margin-top:0.5rem; padding:0.4rem;">
          <option value="">-- Select Inspector --</option>
          <option>Ken Westenkirchner</option>
          <option>Corey Driver</option>
          <option>Murell Gregory</option>
          <option>Khyle Weirich</option>
          <option>Paris Martin</option>
          <option>Matt Prater</option>
          <option>Micheal Hagmeyer</option>
          <option>Other</option>
        </select>
        <button class="rbtn" id="saveInspectorBtn">Use This Name</button>
        <div class="imeta" id="currentInspectorLabel"></div>
      </div>
    </div>
  </div>

  <!-- Location + Status -->
  <div class="two">
    <div class="card">
      <div class="ctitle">Location</div>
      <div class="tbl-w">
        <table>
          <thead><tr><th>Area</th></tr></thead>
          <tbody id="locationColumnBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="ctitle">Inspection Status</div>
      <div class="tbl-w">
        <table>
          <thead><tr><th>Actions</th></tr></thead>
          <tbody id="statusColumnBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Next inspection -->
  <div class="card" id="nextInspectionCard" style="display:none;">
    <div class="ctitle">Inspection Complete</div>
    <p class="ssub" id="nextInspectionText"></p>
  </div>

  <div class="foot">SFDS Facilities Inspector Interface</div>

</main>

<div id="toast"></div>

<!-- Your full JS logic preserved exactly -->
<script>
/* 100% of your original JS from inspector.html goes here — unchanged */
</script>

</body>
</html>
