<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFS Facility Inspections</title>

<link rel="stylesheet" href="style.css">

</head>
<body class="inspector-body">

<header class="top-header">
  <div class="header-red"></div>

  <div class="header-inner">
    <div>
      <h1>🏫 SFS Facility Inspection System</h1>
      <p>St. Francis de Sales High School</p>
    </div>

    <div class="header-right">
      <div class="live-pill">
        <span class="live-dot"></span>
        LIVE
      </div>

      <div id="clock"></div>
    </div>
  </div>
</header>

<main class="main-wrap">

  <!-- LOGIN SCREEN -->
  <section id="login-screen" class="card login-card">

    <h2>Select Inspector</h2>

    <select id="inspector-select">
      <option value="">Select Name</option>
    </select>

    <div id="other-name-wrap" style="display:none;">
      <input
        type="text"
        id="other-name"
        placeholder="Enter Your Name"
      >
    </div>

    <button class="primary-btn" onclick="startInspection()">
      Begin Inspection
    </button>

  </section>

  <!-- INSPECTION SCREEN -->
  <section id="inspection-screen" style="display:none;">

    <div class="card inspector-info-card">
      <div>
        <div class="small-label">CURRENT INSPECTOR</div>
        <div id="active-inspector" class="big-name"></div>
      </div>

      <div>
        <div class="small-label">CURRENT INSPECTION WINDOW</div>
        <div id="inspection-window"></div>
      </div>

      <div>
        <div class="small-label">NEXT RESET</div>
        <div id="countdown"></div>
      </div>
    </div>

    <div class="card">

      <div class="section-title">
        Hourly Inspection Checklist
      </div>

      <div id="inspection-board"></div>

    </div>

  </section>

</main>

<script src="script.js"></script>

<script>

initializeInspectorPage();

</script>

</body>
</html>
