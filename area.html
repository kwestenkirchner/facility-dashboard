<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SF Knights Facilities</title>

<style>
:root {
  --red: #CC0000;
  --blue: #003087;
  --green: #1E6B3C;
  --light-red: #fff0f0;
  --light-blue: #f0f4ff;
  --light-green: #f0fff6;
  --gray: #666;
  --border: #e5e7eb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f8f9fa;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header { background: var(--blue); padding: 0; }
.header-red { background: var(--red); padding: 14px 20px 10px; text-align: center; }
.header-blue { background: var(--blue); padding: 10px 20px 14px; text-align: center; }

.school-name {
  color: white;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.5px;
}
.system-name {
  color: rgba(255,255,255,0.75);
  font-size: 12px;
  margin-top: 2px;
}

.mode-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: white;
  margin-top: 6px;
}
.mode-summer { background: #CC7000; }
.mode-schoolyear { background: var(--green); }
.mode-offseason { background: #555; }

/* AREA CARD */
.area-card {
  margin: 16px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  overflow: hidden;
}
.area-code {
  background: var(--blue);
  color: white;
  text-align: center;
  padding: 12px;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 1px;
}
.area-name {
  text-align: center;
  padding: 10px 16px 14px;
  font-size: 17px;
  font-weight: 600;
  color: #1a1a2e;
  border-bottom: 1px solid var(--border);
}

/* ACTION BUTTONS */
.actions {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.action-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-radius: 12px;
  text-decoration: none;
  border: 2px solid transparent;
  transition: transform 0.15s, box-shadow 0.15s;
  cursor: pointer;
  position: relative;
}
.action-btn:active { transform: scale(0.98); }

.btn-inspection { background: var(--light-red); border-color: #ffcccc; }
.btn-summer { background: #fffbf0; border-color: #ffe5b4; }
.btn-maint { background: #fff7f0; border-color: #ffd9b4; }
.btn-schoolday { background: var(--light-green); border-color: #b4e8cc; }

.btn-icon { font-size: 28px; width: 44px; text-align: center; flex-shrink: 0; }
.btn-text { flex: 1; }
.btn-title { font-size: 16px; font-weight: 700; color: #1a1a2e; display: block; }
.btn-sub { font-size: 12px; color: var(--gray); margin-top: 2px; display: block; }
.btn-arrow { font-size: 18px; color: #ccc; flex-shrink: 0; }

.btn-inspection .btn-title { color: var(--red); }
.btn-summer .btn-title { color: #8B5E00; }
.btn-maint .btn-title { color: #8B3E00; }
.btn-schoolday .btn-title { color: var(--green); }

/* ACTIVE MODE RING */
.active-mode-ring {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 3px rgba(34,197,94,0.25);
}

/* DISABLED */
.btn-disabled {
  opacity: 0.45;
  pointer-events: none;
}
.btn-disabled .btn-sub::after {
  content: " — Not active yet";
}

/* FOOTER */
.footer { margin-top: auto; padding: 16px; text-align: center; }
.footer-inner {
  background: var(--blue);
  border-radius: 12px;
  padding: 10px 16px;
  color: rgba(255,255,255,0.7);
  font-size: 11px;
  line-height: 1.6;
}
.footer-inner a {
  color: rgba(255,255,255,0.9);
  text-decoration: none;
  font-weight: 600;
}

/* ERROR */
.error-card {
  margin: 24px 16px;
  background: white;
  border-radius: 16px;
  padding: 32px 20px;
  text-align: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.error-icon { font-size: 48px; margin-bottom: 12px; }
.error-title { font-size: 18px; font-weight: 700; color: var(--red); }
.error-sub { font-size: 14px; color: var(--gray); margin-top: 8px; }

.timestamp {
  font-size: 10px;
  color: #aaa;
  text-align: center;
  padding: 0 16px 12px;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-red">
    <div class="school-name">⚜️ SF Knights</div>
    <div class="system-name">Facilities Management System</div>
  </div>
  <div class="header-blue">
    <span class="mode-badge" id="modeBadge">Loading...</span>
  </div>
</div>

<div id="mainContent"></div>
<div class="timestamp" id="timestamp"></div>

<div class="footer">
  <div class="footer-inner">
    <a href="https://kwestenkirchner.github.io/facility-dashboard/">📊 View Dashboard</a>
    &nbsp;·&nbsp; SF Knights Facilities 2026
    <br>Scan • Log • Complete
  </div>
</div>

<script>
// CONFIG
const SUMMER_START = new Date('2026-05-22');
const SUMMER_END = new Date('2026-08-18');
const GF_BASE = 'https://docs.google.com/forms/d/e';

// Facility Inspection
const INSP = {
  id: '1FAIpQLSdv0823sBL02gmS9hErEdXtpKLNaWyahyLUxqt5apCOQCEcdQ',
  name: '1902915184',
  code: '1467413444'
};

// Summer Custodial
const SUMMER_CUST = {
  id: '1FAIpQLSeDo7uEm6RH2kzNCo_85efiDHWIncsC_k5XDx0RLlZz1UVnRA',
  name: '716925965',
  code: '1159531581'
};

// Summer Maintenance
const SUMMER_MAINT = {
  id: '1FAIpQLSdyhbIRhUgaMoSuTsQyZYqWc_CmdtoVXGb3AARMfp_DJow8QA',
  name: '2112482882',
  code: '1159531581'
};

// School Year Custodial (placeholder)
const SCHOOL_YEAR_FORM = {
  id: 'SCHOOL_YEAR_FORM_ID_TBD',
  name: 'ENTRY_NAME_TBD',
  code: 'ENTRY_CODE_TBD'
};

// URL builder
function buildUrl(formId, entries) {
  const base = `${GF_BASE}/${formId}/viewform?usp=pp_url`;
  return base + Object.entries(entries)
    .map(([k,v]) => `&entry.${k}=${encodeURIComponent(v)}`)
    .join('');
}

// Mode detection
function getMode() {
  const today = new Date();
  today.setHours(0,0,0,0);
  if (today >= SUMMER_START && today <= SUMMER_END) return 'summer';
  if (today > SUMMER_END) return 'schoolyear';
  return 'offseason';
}

// MAIN
function render() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code') || '';
  const name = decodeURIComponent(params.get('name') || '').replace(/\+/g,' ');
  const mode = getMode();
  const now = new Date();

  document.getElementById('timestamp').textContent =
    `Scanned: ${now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})} at ${now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;

  const badge = document.getElementById('modeBadge');
  if (mode === 'summer') {
    badge.textContent = '☀️ SUMMER MODE — May 22 – Aug 18, 2026';
    badge.className = 'mode-badge mode-summer';
  } else if (mode === 'schoolyear') {
    badge.textContent = '🏫 SCHOOL YEAR MODE';
    badge.className = 'mode-badge mode-schoolyear';
  } else {
    badge.textContent = '📋 PRE-SUMMER — Inspection Mode';
    badge.className = 'mode-badge mode-offseason';
  }

  if (!code) {
    document.getElementById('mainContent').innerHTML = `
      <div class="error-card">
        <div class="error-icon">🔍</div>
        <div class="error-title">Area Not Found</div>
        <div class="error-sub">This QR code is missing an area code.<br>Please scan the QR code posted in the area.</div>
      </div>`;
    return;
  }

  // URLs
  const inspUrl = buildUrl(INSP.id, { [INSP.name]: name, [INSP.code]: code });

  const summerCustUrl = buildUrl(SUMMER_CUST.id, {
    [SUMMER_CUST.name]: name,
    [SUMMER_CUST.code]: code
  });

  const summerMaintUrl = buildUrl(SUMMER_MAINT.id, {
    [SUMMER_MAINT.name]: name,
    [SUMMER_MAINT.code]: code
  });

  const syReady = SCHOOL_YEAR_FORM.id !== 'SCHOOL_YEAR_FORM_ID_TBD';
  const schoolUrl = syReady
    ? buildUrl(SCHOOL_YEAR_FORM.id, {
        [SCHOOL_YEAR_FORM.name]: name,
        [SCHOOL_YEAR_FORM.code]: code
      })
    : '#';

  const isSummer = mode === 'summer';
  const isSchool = mode === 'schoolyear';

  document.getElementById('mainContent').innerHTML = `
    <div class="area-card">
      <div class="area-code">${code}</div>
      <div class="area-name">${name || 'Unknown Area'}</div>

      <div class="actions">

        <!-- Facility Inspection -->
        <a href="${inspUrl}" class="action-btn btn-inspection" target="_blank">
          <div class="btn-icon">🔍</div>
          <div class="btn-text">
            <span class="btn-title">Facility Inspection</span>
            <span class="btn-sub">Report an issue or log an inspection</span>
          </div>
          ${!isSummer && !isSchool ? '<div class="active-mode-ring"></div>' : ''}
          <div class="btn-arrow">›</div>
        </a>

        <!-- Summer Custodial -->
        <a href="${isSummer ? summerCustUrl : '#'}"
           class="action-btn btn-summer ${!isSummer ? 'btn-disabled' : ''}"
           ${isSummer ? 'target="_blank"' : ''}>
          <div class="btn-icon">☀️</div>
          <div class="btn-text">
            <span class="btn-title">Summer Custodial</span>
            <span class="btn-sub">Log tasks completed in this area${isSummer ? '' : ' (available May 22)'}</span>
          </div>
          ${isSummer ? '<div class="active-mode-ring"></div>' : ''}
          <div class="btn-arrow">›</div>
        </a>

        <!-- Summer Maintenance -->
        <a href="${isSummer ? summerMaintUrl : '#'}"
           class="action-btn btn-maint ${!isSummer ? 'btn-disabled' : ''}"
           ${isSummer ? 'target="_blank"' : ''}>
          <div class="btn-icon">🛠️</div>
          <div class="btn-text">
            <span class="btn-title">Summer Maintenance</span>
            <span class="btn-sub">Log maintenance work${isSummer ? '' : ' (available May 22)'}</span>
          </div>
          ${isSummer ? '<div class="active-mode-ring"></div>' : ''}
          <div class="btn-arrow">›</div>
        </a>

        <!-- School Day Custodial -->
        <a href="${isSchool && syReady ? schoolUrl : '#'}"
           class="action-btn btn-schoolday ${(!isSchool || !syReady) ? 'btn-disabled' : ''}"
           ${isSchool && syReady ? 'target="_blank"' : ''}>
          <div class="btn-icon">🏫</div>
          <div class="btn-text">
            <span class="btn-title">School Day Log</span>
            <span class="btn-sub">Log daily work${isSchool ? '' : ' (available Aug 19)'}</span>
          </div>
          ${isSchool ? '<div class="active-mode-ring"></div>' : ''}
          <div class="btn-arrow">›</div>
        </a>

      </div>
    </div>`;
}

render();
</script>

</body>
</html>
