<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <h1>Inspection Dashboard</h1>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">

        <!-- TOP CARD GRID -->
        <section class="card-grid">

            <div class="card card-blue">
                <h2>Total Inspections</h2>
                <p id="totalInspections">0</p>
            </div>

            <div class="card card-red">
                <h2>Open Issues</h2>
                <p id="openIssues">0</p>
            </div>

            <div class="card card-green">
                <h2>Resolved</h2>
                <p id="resolvedIssues">0</p>
            </div>

            <div class="card card-gray">
                <h2>No Issues Found</h2>
                <p id="noIssues">0</p>
            </div>

        </section>

        <!-- TABLE OF RECENT INSPECTIONS -->
        <section class="table-section">
            <h2>Recent Inspections</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Inspector</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="inspectionTableBody">
                    <!-- Filled by JS -->
                </tbody>
            </table>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>SF Knights Facilities • Inspection Dashboard</p>
    </footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyB4dnmyZ6ryNIX5atAnhf0J1m6HnxDLzadJtdXf0COKaDDY08H0VlL0CZQSOO5KQmi2g/exec?action=getAllInspections";

async function loadDashboard() {
    try {
        const response = await fetch(API_URL);
        const data = await response.json();

        // Update counts
        document.getElementById("totalInspections").textContent = data.length;

        const open = data.filter(x => x.status === "Open").length;
        const resolved = data.filter(x => x.status === "Resolved").length;
        const noIssues = data.filter(x => x.type === "No Issues Found").length;

        document.getElementById("openIssues").textContent = open;
        document.getElementById("resolvedIssues").textContent = resolved;
        document.getElementById("noIssues").textContent = noIssues;

        // Fill table
        const tbody = document.getElementById("inspectionTableBody");
        tbody.innerHTML = "";

        data.slice().reverse().forEach(item => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${item.timestamp || ""}</td>
                <td>${item.inspector || ""}</td>
                <td>${item.location || ""}</td>
                <td>${item.status || item.type || ""}</td>
                <td>${item.notes || ""}</td>
            `;

            tbody.appendChild(row);
        });

    } catch (err) {
        console.error("Error loading dashboard:", err);
    }
}

loadDashboard();
</script>

</body>
</html>
