<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>Inspection Dashboard</h1>
</header>

<main class="container">

    <section class="card-grid">
        <div class="card card-blue">
            <h2>Total Inspections</h2>
            <p id="totalInspections">0</p>
        </div>

        <div class="card card-red">
            <h2>Open Issues</h2>
            <p id="openIssues">0</p>
        </div>

        <div class="card card-green">
            <h2>Resolved</h2>
            <p id="resolvedCount">0</p>
        </div>

        <div class="card card-gray">
            <h2>Avg Issue Time</h2>
            <p id="avgIssueTime">N/A</p>
        </div>
    </section>

    <section class="table-section">
        <h2>Recent Inspections</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Inspector</th>
                    <th>Location</th>
                    <th>Issues Found</th>
                    <th>Resolved</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody id="recentTableBody"></tbody>
        </table>
    </section>

</main>

<footer class="footer">
    <p>SF Knights Facilities • Inspection Dashboard</p>
</footer>

<script>
const API = "https://script.google.com/macros/s/AKfycbyB4dnmyZ6ryNIX5atAnhf0J1m6HnxDLzadJtdXf0COKaDDY08H0VlL0CZQSOO5KQmi2g/exec?action=getAllInspections";

async function loadDashboard() {
    const res = await fetch(API);
    const data = await res.json();

    document.getElementById("totalInspections").textContent = data.length;

    const openIssues = data.filter(r =>
        r["Issues Found (Select all that apply)"] !== "No Issues Found" &&
        r["Resolved"] !== "TRUE"
    );
    document.getElementById("openIssues").textContent = openIssues.length;

    const resolved = data.filter(r => r["Resolved"] === "TRUE");
    document.getElementById("resolvedCount").textContent = resolved.length;

    updateAvgIssueTime(openIssues);
    buildRecentTable(data);
}

function updateAvgIssueTime(openIssues) {
    const hours = [];

    openIssues.forEach(r => {
        if (!r.timestamp) return;
        const d = new Date(r.timestamp);
        if (!isNaN(d)) hours.push(d.getHours() + d.getMinutes() / 60);
    });

    if (hours.length === 0) {
        document.getElementById("avgIssueTime").textContent = "N/A";
        return;
    }

    const avg = hours.reduce((a, b) => a + b, 0) / hours.length;
    const hour = Math.floor(avg);
    const minutes = Math.round((avg - hour) * 60);

    const d = new Date();
    d.setHours(hour);
    d.setMinutes(minutes);

    document.getElementById("avgIssueTime").textContent =
        d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function buildRecentTable(data) {
    const tbody = document.getElementById("recentTableBody");
    tbody.innerHTML = "";

    data.slice().reverse().forEach(r => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${r.timestamp || ""}</td>
            <td>${r.inspector || ""}</td>
            <td>${r.location || ""}</td>
            <td>${r["Issues Found (Select all that apply)"] || ""}</td>
            <td>${r["Resolved"] || ""}</td>
            <td>${r.notes || ""}</td>
        `;
        tbody.appendChild(row);
    });
}

loadDashboard();
</script>

</body>
</html>
