<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facility Inspection</title>

<style>
    :root {
        --bg: #f4f6f9;
        --text: #001F3F;
        --card: #ffffff;
        --button-bg: #001F3F;
        --button-text: #ffffff;
        --accent: #FFDC00;
    }

    [data-theme="dark"] {
        --bg: #00152A;
        --text: #ffffff;
        --card: #0A2A4A;
        --button-bg: #FFDC00;
        --button-text: #001F3F;
        --accent: #FFDC00;
    }

    body {
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        transition: background 0.3s, color 0.3s;
    }

    header {
        background: #001F3F;
        color: white;
        padding: 16px;
        font-size: 22px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .toggle {
        cursor: pointer;
        font-size: 16px;
        background: var(--accent);
        color: #001F3F;
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 600;
    }

    .container {
        max-width: 500px;
        margin: 40px auto;
        padding: 20px;
        text-align: center;
    }

    .btn {
        width: 100%;
        padding: 18px;
        margin: 15px 0;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: var(--button-bg);
        color: var(--button-text);
        font-weight: 600;
        transition: opacity 0.2s;
    }

    .btn:hover {
        opacity: 0.9;
    }
</style>

<script>
function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);

    const toggle = document.getElementById("themeToggle");
    toggle.textContent = theme === "dark" ? "Light Mode ☀️" : "Dark Mode 🌙";
}

window.onload = () => {
    const saved = localStorage.getItem("theme") || "light";
    applyTheme(saved);
};

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
}
</script>

</head>
<body>

<header>
    Facility Inspection
    <div id="themeToggle" class="toggle" onclick="toggleTheme()">Dark Mode 🌙</div>
</header>

<div class="container">
    <button class="btn" onclick="location.href='inspect.html'">Start Inspection</button>
    <button class="btn" onclick="location.href='dashboard.html'">View Dashboard</button>
</div>

</body>
</html>
