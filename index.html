<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inspection Dashboard</title>

<style>
    /* KEEPING YOUR EXISTING FONT + BASE STYLES EXACTLY AS THEY WERE */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
    }

    h1, h2 {
        margin-bottom: 10px;
    }

    /* GRID: 3 CARDS PER ROW */
    .location-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 20px;
    }

    /* LOCATION CARD BASE */
    .location-card {
        padding: 20px;
        border-radius: 10px;
        color: #000;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* FULL‑COLOR STATES (soft modern colors) */
    .all-clear {
        background-color: #4CAF50; /* green */
        color: white;
    }
    .issues-found {
        background-color: #F44336; /* red */
        color: white;
    }
    .inspection-due {
        background-color: #FFEB3B; /* yellow */
        color: black;
    }

    /* TABLES */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        background: white;
    }
    th, td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }
    th {
        background: #eee;
    }

    /* BUTTON */
    .resolve-btn {
        background: #2196F3;
        color: white;
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h1>Inspection Dashboard</h1>

<h2>Location Status</h2>
<div id="locationGrid" class="location-grid"></div>

<h2>Open Issues</h2>
<table id="openIssuesTable">
    <thead>
        <tr>
            <th>Location</th>
            <th>Issue</th>
            <th>Inspector</th>
            <th>Timestamp</th>
            <th>Resolve</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<h2>Recent Inspections</h2>
<table id="recentInspectionsTable">
    <thead>
        <tr>
            <th>Location</th>
            <th>Inspector</th>
            <th>Timestamp</th>
            <th>Issues</th>
            <th>Resolved</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
/* MASTER LOCATION LIST — ALWAYS SHOW THESE CARDS */
const MASTER_LOCATIONS = [
    "3rd Floor Restroom",
    "2nd Floor Restroom",
    "Cafeteria Mens Restroom",
    "Auxiliary Gym Locker Room - South Gym Locker Room",
    "Auxiliary Gym Locker Room - North Wrestling-Baseball Locker Room"
];

/* FORMAT TIMESTAMP TO LOCAL TIME */
function formatTimestamp(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleString("en-US", {
        month: "numeric",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "numeric",
        second: "numeric"
    });
}

/* FETCH DATA FROM APPS SCRIPT */
async function loadData() {
    const res = await fetch(
        "https://script.google.com/macros/s/AKfycbx8iYtYtYtYtYtYtYtYtYtYtYtYtYtYtYt/exec?action=getAllInspections"
    );
    return await res.json();
}

/* RENDER DASHBOARD */
async function renderDashboard() {
    const data = await loadData();

    /* Build lookup of latest inspection per location */
    const latest = {};
    data.forEach(row => {
        const loc = row.location;
        if (!latest[loc] || new Date(row.timestamp) > new Date(latest[loc].timestamp)) {
            latest[loc] = row;
        }
    });

    /* LOCATION CARDS */
    const grid = document.getElementById("locationGrid");
    grid.innerHTML = "";

    MASTER_LOCATIONS.forEach(loc => {
        const row = latest[loc];
        let statusClass = "inspection-due";
        let statusLabel = "Inspection Due";
        let inspector = "";
        let timestamp = "";

        if (row) {
            inspector = row.inspector;
            timestamp = formatTimestamp(row.timestamp);

            if (row.issues && row.issues.trim() !== "") {
                if (row.resolvedBy && row.resolvedAt) {
                    statusClass = "all-clear";
                    statusLabel = "All Clear";
                } else {
                    statusClass = "issues-found";
                    statusLabel = "Issues Found";
                }
            } else {
                statusClass = "all-clear";
                statusLabel = "All Clear";
            }
        }

        const card = document.createElement("div");
        card.className = `location-card ${statusClass}`;
        card.innerHTML = `
            <h3>${loc}</h3>
            <p><strong>Status:</strong> ${statusLabel}</p>
            <p><strong>Last Inspection:</strong> ${timestamp || "None"}</p>
            <p><strong>Inspector:</strong> ${inspector || "N/A"}</p>
        `;
        grid.appendChild(card);
    });

    /* OPEN ISSUES TABLE */
    const openBody = document.querySelector("#openIssuesTable tbody");
    openBody.innerHTML = "";

    data.filter(r => r.issues && !r.resolvedBy).forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${r.location}</td>
            <td>${r.issues}</td>
            <td>${r.inspector}</td>
            <td>${formatTimestamp(r.timestamp)}</td>
            <td><button class="resolve-btn" onclick="resolveIssue(${r.id})">Resolve</button></td>
        `;
        openBody.appendChild(tr);
    });

    /* RECENT INSPECTIONS TABLE */
    const recentBody = document.querySelector("#recentInspectionsTable tbody");
    recentBody.innerHTML = "";

    data.slice(-20).reverse().forEach(r => {
        let resolvedLabel = "";
        if (!r.issues) {
            resolvedLabel = "All Clear";
        } else if (r.issues && !r.resolvedBy) {
            resolvedLabel = "No";
        } else if (r.issues && r.resolvedBy) {
            resolvedLabel = "Yes";
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${r.location}</td>
            <td>${r.inspector}</td>
            <td>${formatTimestamp(r.timestamp)}</td>
            <td>${r.issues || "All Clear"}</td>
            <td>${resolvedLabel}</td>
        `;
        recentBody.appendChild(tr);
    });
}

/* RESOLVE ISSUE */
async function resolveIssue(id) {
    await fetch(
        "https://script.google.com/macros/s/AKfycbx8iYtYtYtYtYtYtYtYtYtYtYtYtYtYtYt/exec",
        {
            method: "POST",
            body: JSON.stringify({ action: "resolveIssue", id })
        }
    );
    renderDashboard();
}

/* INITIAL LOAD */
renderDashboard();
</script>

</body>
</html>
