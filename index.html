<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facility Inspection Dashboard — St. Francis de Sales</title>

<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #1a3a5c;
  --red: #b91c1c;
  --red-bg: #fee2e2;
  --green: #15803d;
  --green-bg: #dcfce7;
  --amber: #b45309;
  --amber-bg: #fef3c7;
  --gray: #6b7280;
  --gray-bg: #f3f4f6;
  --border: #e5e7eb;
  --white: #ffffff;
  --text: #111827;
  --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f0f4f8;
  color: var(--text);
}

header {
  background: var(--navy);
  color: var(--white);
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow);
}

header h1 {
  font-size: 22px;
  font-weight: 600;
}

#clock {
  font-size: 18px;
  font-weight: 500;
}

main {
  padding: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.card {
  background: var(--white);
  padding: 18px;
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.card h2 {
  font-size: 16px;
  margin-bottom: 8px;
  color: var(--gray);
}

.card .value {
  font-size: 32px;
  font-weight: 700;
  color: var(--navy);
}

.loc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.loc {
  background: var(--white);
  padding: 16px;
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.loc h3 {
  font-size: 16px;
  margin-bottom: 6px;
  font-weight: 600;
}

.loc .status {
  font-size: 14px;
  font-weight: 600;
}

.loc.ok { background: var(--green-bg); }
.loc.warn { background: var(--amber-bg); }
.loc.bad { background: var(--red-bg); }

.table-wrap {
  background: var(--white);
  padding: 16px;
  border-radius: 8px;
  box-shadow: var(--shadow);
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead th {
  text-align: left;
  padding: 10px;
  background: var(--gray-bg);
  border-bottom: 2px solid var(--border);
}

tbody td {
  padding: 10px;
  border-bottom: 1px solid var(--border);
}

.loading {
  text-align: center;
  padding: 20px;
  font-size: 16px;
}
</style>
</head>
<body>

<header>
  <h1>Facility Inspection Dashboard</h1>
  <div id="clock">--:--:--</div>
</header>

<main>
<!-- SUMMARY CARDS -->
<div class="cards">
  <div class="card">
    <h2>Total Inspections (24h)</h2>
    <div class="value" id="card-total">0</div>
  </div>

  <div class="card">
    <h2>Issues Reported (24h)</h2>
    <div class="value" id="card-issues">0</div>
  </div>

  <div class="card">
    <h2>On Time Rate</h2>
    <div class="value" id="card-ontime">0%</div>
  </div>

  <div class="card">
    <h2>Last Updated</h2>
    <div class="value" id="card-updated">--</div>
  </div>
</div>

<!-- LOCATION STATUS GRID -->
<div class="loc-grid" id="loc-grid"></div>

<!-- TABLE OF ALL INSPECTIONS -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Time</th>
        <th>Location</th>
        <th>Inspector</th>
        <th>Issues</th>
        <th>Status</th>
        <th>Photos</th>
      </tr>
    </thead>

    <tbody id="tbody">
      <tr>
        <td colspan="7" class="loading">
          <span class="spin"></span>Loading...
        </td>
      </tr>
    </tbody>
  </table>
</div>

</main>

<div id="toast" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #1a3a5c;
  color: white;
  padding: 12px 18px;
  border-radius: 6px;
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
  font-size: 15px;
"></div>
<script>
// Your Google Apps Script Web App URL
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyB4dnmyZ6ryNIX5atAnhf0J1m6HnxDLzadJtdXf0COKaDDY08H0VlL0CZQSOO5KQmi2g/exec";

const REFRESH_MS = 120000;

const LOCATIONS = [
  "Auxiliary Gym Locker Room - South",
  "2nd Level Restroom",
  "3rd Level Restroom",
  "Cafeteria Mens Restroom"
];

const STALE_HOURS = 2;

const INSPECTORS = [
  "Ken Westenkirchner",
  "Matt Prater",
  "Corey Driver",
  "Murell Gregory",
  "Khyle Weirich",
  "Paris Martin",
  "Michael Hagmeyer"
];

let DATA = null;

// CLOCK
setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("en-US", {
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit"
    });
}, 1000);

// TOAST
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.opacity = "1";
  setTimeout(() => { t.style.opacity = "0"; }, 3000);
}

// FETCH DATA
async function fetchData() {
  try {
    const res = await fetch(ENDPOINT);
    const json = await res.json();

    if (!Array.isArray(json)) {
      console.error("Backend did not return an array.");
      return;
    }

    DATA = json;
    renderAll();
    showToast("Dashboard updated");
  } catch (err) {
    console.error("Fetch error:", err);
  }
}

// AUTO REFRESH
setInterval(fetchData, REFRESH_MS);
// RENDER ALL
function renderAll() {
  if (!DATA || DATA.length === 0) return;

  renderCards();
  renderLocGrid();
  renderTable();
}

// RENDER SUMMARY CARDS
function renderCards() {
  const now = Date.now();
  const cutoff = now - (24 * 60 * 60 * 1000);

  let total = 0;
  let issues = 0;
  let onTime = 0;
  let updated = "--";

  DATA.forEach(row => {
    const ts = new Date(row.Timestamp).getTime();
    if (ts >= cutoff) {
      total++;
      if (row.Issues && row.Issues.trim() !== "") issues++;
      if (row.Status && row.Status.toLowerCase() === "on time") onTime++;
    }
  });

  const onTimeRate = total > 0 ? Math.round((onTime / total) * 100) : 0;

  document.getElementById("card-total").textContent = total;
  document.getElementById("card-issues").textContent = issues;
  document.getElementById("card-ontime").textContent = onTimeRate + "%";

  if (DATA.length > 0) {
    updated = DATA[0].Timestamp || "--";
  }
  document.getElementById("card-updated").textContent = updated;
}

// RENDER LOCATION GRID
function renderLocGrid() {
  const grid = document.getElementById("loc-grid");
  grid.innerHTML = "";

  LOCATIONS.forEach(loc => {
    const rows = DATA.filter(r => r.Location === loc);

    let statusClass = "ok";
    let statusText = "OK";

    if (rows.length === 0) {
      statusClass = "warn";
      statusText = "No recent data";
    } else {
      const last = rows[0];
      if (last.Issues && last.Issues.trim() !== "") {
        statusClass = "bad";
        statusText = "Issues Reported";
      }
    }

    const div = document.createElement("div");
    div.className = "loc " + statusClass;

    div.innerHTML = `
      <h3>${loc}</h3>
      <div class="status">${statusText}</div>
    `;

    grid.appendChild(div);
  });
}
// RENDER TABLE
function renderTable() {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  if (!DATA || DATA.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="loading">No data available</td>
      </tr>
    `;
    return;
  }

  DATA.forEach(row => {
    const tr = document.createElement("tr");

    const date = row.Date || row.Timestamp || "";
    const time = row.Time || "";
    const loc = row.Location || "";
    const insp = row.Inspector || row["Your Name"] || "";
    const issues = row.Issues || row["Issues Found"] || "";
    const status = row.Status || "";
    const photo = row.Photo || row.Photos || "";

    let photoHTML = "";
    if (photo && photo.trim() !== "") {
      photoHTML = `<a href="${photo}" target="_blank">View</a>`;
    } else {
      photoHTML = "--";
    }

    tr.innerHTML = `
      <td>${date}</td>
      <td>${time}</td>
      <td>${loc}</td>
      <td>${insp}</td>
      <td>${issues}</td>
      <td>${status}</td>
      <td>${photoHTML}</td>
    `;

    tbody.appendChild(tr);
  });
}
// INITIAL LOAD
fetchData();

</script>

</body>
</html>
