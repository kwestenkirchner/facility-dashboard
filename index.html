<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Supervisor Dashboard
</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<header>

  <div class="topbar"></div>

  <div class="header-inner">

    <div class="header-title">

      <h1>
        🏫 Facility Inspection Dashboard
      </h1>

      <p>
        Supervisor View
      </p>

    </div>

    <div class="header-right">

      <div class="clock"
           id="liveClock">
      </div>

      <button
        class="refresh-btn"
        onclick="loadSupervisorDashboard()">

        Refresh

      </button>

    </div>

  </div>

</header>

<div id="toast"></div>

<main>

  <!-- STATS -->

  <div class="stats-grid">

    <div class="stat-card">

      <div class="stat-label">
        Total Inspections
      </div>

      <div class="stat-value"
           id="totalInspections">
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        Resolved Issues
      </div>

      <div class="stat-value"
           id="resolvedIssues">
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        Open Issues
      </div>

      <div class="stat-value"
           id="openIssues">
      </div>

    </div>

  </div>


  <!-- COUNTDOWN -->

  <div class="countdown"
       id="countdownBox">
  </div>


  <!-- AREA STATUS -->

  <div class="section-title">
    Area Status
  </div>

  <div class="area-grid"
       id="locationCards">
  </div>


  <!-- AVERAGE ISSUE TIMES -->

  <div class="section-title">
    Average Time Issues Reported
  </div>

  <div class="avg-grid"
       id="issueAverageCards">
  </div>


  <!-- OPEN ISSUES TABLE -->

  <div class="section-title">
    Open Issues
  </div>

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>Date</th>
          <th>Time</th>
          <th>Location</th>
          <th>Inspector</th>
          <th>Issues</th>
          <th>Notes</th>
          <th>Asana</th>
          <th>Resolve</th>

        </tr>

      </thead>

      <tbody id="issueLogBody">

      </tbody>

    </table>

  </div>

</main>

<script src="script.js"></script>

<script>

initializeSupervisorPage();

</script>

</body>
</html>
