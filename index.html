<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facility Inspection Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="supervisor">
    <header>
        <h1>Facility Inspection Dashboard</h1>
        <nav>
            <button onclick="switchView('supervisor')">Supervisor View</button>
            <button onclick="switchView('inspector')">Inspector View</button>
        </nav>
    </header>

    <!-- SUPERVISOR DASHBOARD -->
    <section id="supervisor-section" class="dashboard-section">
        <h2>Supervisor Overview</h2>

        <div class="stats-container">
            <div class="stat-box">
                <h3>Total Inspections</h3>
                <p id="total-inspections">0</p>
            </div>
            <div class="stat-box">
                <h3>Resolved</h3>
                <p id="resolved-count">0</p>
            </div>
            <div class="stat-box">
                <h3>Unresolved</h3>
                <p id="unresolved-count">0</p>
            </div>
        </div>

        <table id="inspection-table">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Inspector</th>
                    <th>Location</th>
                    <th>Issues</th>
                    <th>Notes</th>
                    <th>Resolved</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="inspection-table-body"></tbody>
        </table>
    </section>

    <!-- INSPECTOR DASHBOARD -->
    <section id="inspector-section" class="dashboard-section hidden">
        <h2>Submit Inspection</h2>

        <label for="inspector-name">Inspector Name:</label>
        <input type="text" id="inspector-name" placeholder="Your name" />

        <label for="location-select">Location:</label>
        <select id="location-select"></select>

        <label for="issues">Issues Found:</label>
        <input type="text" id="issues" placeholder="Describe issues" />

        <label for="notes">Notes:</label>
        <textarea id="notes" placeholder="Additional notes"></textarea>

        <button onclick="submitInspection()">Submit Inspection</button>
    </section>

    <script src="script.js"></script>

    <script>
        function switchView(view) {
            const supervisor = document.getElementById("supervisor-section");
            const inspector = document.getElementById("inspector-section");

            if (view === "supervisor") {
                document.body.classList.add("supervisor");
                document.body.classList.remove("inspector");
                supervisor.classList.remove("hidden");
                inspector.classList.add("hidden");
                loadSupervisorData();
            } else {
                document.body.classList.add("inspector");
                document.body.classList.remove("supervisor");
                inspector.classList.remove("hidden");
                supervisor.classList.add("hidden");
                loadInspectorLocations();
            }
        }
    </script>
</body>
</html>
