<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SFS Supervisor Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<link rel="stylesheet" href="style.css">

</head>
<body class="supervisor-body">

<header class="top-header">

  <div class="header-red"></div>

  <div class="header-inner">

    <div>
      <h1>🏫 SFS Facility Inspection Dashboard</h1>
      <p>St. Francis de Sales High School</p>
    </div>

    <div class="header-right">

      <div class="live-pill">
        <span class="live-dot"></span>
        LIVE
      </div>

      <div id="clock"></div>

    </div>

  </div>

</header>

<main class="main-wrap">

  <!-- STATS -->
  <div class="stats-grid">

    <div class="stat-card blue">
      <div class="stat-label">TOTAL ISSUES</div>
      <div class="stat-number" id="total-count">0</div>
    </div>

    <div class="stat-card green">
      <div class="stat-label">RESOLVED</div>
      <div class="stat-number" id="resolved-count">0</div>
    </div>

    <div class="stat-card red">
      <div class="stat-label">OPEN ISSUES</div>
      <div class="stat-number" id="unresolved-count">0</div>
    </div>

  </div>

  <!-- AREA STATUS -->
  <div class="card">

    <div class="section-title">
      Area Inspection Status
    </div>

    <div id="area-status-grid" class="area-grid"></div>

  </div>

  <!-- CHART -->
  <div class="card">

    <div class="section-title">
      Average Time Issues Are Reported
    </div>

    <div class="chart-wrap">
      <canvas id="issue-time-chart"></canvas>
    </div>

  </div>

  <!-- TABLE -->
  <div class="card">

    <div class="section-title">
      Inspection Reports
    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Inspector</th>
            <th>Location</th>
            <th>Issues</th>
            <th>Notes</th>
            <th>Resolved</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="inspection-table"></tbody>

      </table>

    </div>

  </div>

</main>

<script src="script.js"></script>

<script>

initializeSupervisorPage();

</script>

</body>
</html>
